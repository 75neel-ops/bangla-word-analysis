name = "bangla-word-analysis-api"
main = "src/index.js"
compatibility_date = "2026-11-13"

[vars]
# Replace/add your actual itch.io game page origin before deployment.
ALLOWED_ORIGINS = "http://localhost:8000,https://75neel-ops.github.io,https://75neel-ops.itch.io,https://html-classic.itch.zone"

[[ratelimits]]
name = "ANALYZE_LIMITER"
# Pick a positive integer unique to your Cloudflare account if this conflicts with another Worker.
namespace_id = "9001001"

[ratelimits.simple]
limit = 8
period = 60
